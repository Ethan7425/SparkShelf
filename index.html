<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5ef" />
    <meta name="description" content="Your personal collection of Instagram finds, easy to find again." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%spark.svg" type="image/svg+xml" />
    <title>SparkShelf — keep your finds close</title>
    <script>
      // Apply the saved style and mode before first paint so the page doesn't flash.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('sparkshelf-theme') === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.style = localStorage.getItem('sparkshelf-style') || 'editorial'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
